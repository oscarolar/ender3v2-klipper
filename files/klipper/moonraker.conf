# Moonraker for the Klipper host (Pi, Linux PC or the Mac's VM). Your LAN is
# trusted; 192.168.64.0/24 is UTM's host-only network (Mac VM only, harmless
# elsewhere). @LAN_CIDR@ is filled by files/tools/deploy-config.sh
# (e.g. 192.168.1.0/24); if you copy this file by hand, replace it yourself.
[server]
host: 0.0.0.0
port: 7125
klippy_uds_address: ~/printer_data/comms/klippy.sock

[authorization]
trusted_clients:
    @LAN_CIDR@
    192.168.64.0/24
    127.0.0.0/8
# Moonraker rejects a bare wildcard (*): list real origins or patterns like *.local
cors_domains:
    *.local
force_logins: false

# lets OrcaSlicer upload with its "Octo/Klipper" host type
[octoprint_compat]

[history]

[file_manager]
enable_object_processing: False

[update_manager]
refresh_interval: 168
enable_auto_refresh: False

[update_manager mainsail]
type: web
channel: stable
repo: mainsail-crew/mainsail
path: ~/mainsail

[update_manager mainsail-config]
type: git_repo
primary_branch: master
path: ~/mainsail-config
origin: https://github.com/mainsail-crew/mainsail-config.git
# static config files: an update must not restart any service (it would abort a print)
is_system_service: False

# Uncomment after installing moonraker-obico (it creates this file):
#[include moonraker-obico-update.cfg]
