# Ender 3 V2, board V4.2.2 (STM32F103/GD32F303), stock bowden extruder,
# CR Touch (or clone) on the BLTouch port with the stock mount.
# Based on Klipper's config/printer-creality-ender3-v2-2020.cfg.
# The same file works on any Klipper host: /dev/printer is the board's CH340,
# linked by udev on a Raspberry Pi / Linux PC, or the socat pty fed by the
# Mac's TCP bridge in the VM setup (files/host/printer-link.sh creates it).
# Calibrated values (PID, probe z_offset, mesh, twist) are written by SAVE_CONFIG
# into an autosave block at the end of this file. The commented values marked
# "reference" come from ONE printer: recalibrate yours, do not copy them.

[include mainsail.cfg]
[include macros.cfg]

[mcu]
# not /dev/serial/by-id/...: /dev/printer exists only after the cutover
# (printer-link.sh enable), so Klipper cannot grab a printer still on Marlin
serial: /dev/printer
baud: 250000
restart_method: command

[printer]
kinematics: cartesian
max_velocity: 200
max_accel: 3000
# reference: ringing tower (80 mm/s walls, accel 1500-7000) showed only a faint
# single echo from ~5500 up, none below; so 3000 without [input_shaper].
# Start at 3000 and run your own tower (skills/ender3v2-klipper/references/calibration.md).
max_z_velocity: 5
max_z_accel: 100
square_corner_velocity: 5.0

[stepper_x]
step_pin: PC2
dir_pin: PB9
enable_pin: !PC3
microsteps: 16
rotation_distance: 40
endstop_pin: ^PA5
position_endstop: 0
position_max: 235
homing_speed: 50

[stepper_y]
step_pin: PB8
dir_pin: PB7
enable_pin: !PC3
microsteps: 16
rotation_distance: 40
endstop_pin: ^PA6
position_endstop: 0
position_max: 235
homing_speed: 50

[stepper_z]
step_pin: PB6
dir_pin: !PB5
enable_pin: !PC3
microsteps: 16
rotation_distance: 8
endstop_pin: probe:z_virtual_endstop
position_min: -5
position_max: 250

[extruder]
step_pin: PB4
dir_pin: PB3
enable_pin: !PC3
microsteps: 16
# = 200 * 16 / (Marlin M92 E value); stock E93 -> 34.406, E106.4 -> 30.075.
# 34.406 is the upstream value for the stock E93. Use your Marlin M503 E value,
# then the 100 mm extrusion check. reference: 30.075 on this printer.
rotation_distance: 34.406
nozzle_diameter: 0.400
filament_diameter: 1.750
max_extrude_only_distance: 150.0
heater_pin: PA1
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PC5
# PID comes from PID_CALIBRATE + SAVE_CONFIG. Until then Klipper needs a
# starting point: these are the upstream example values.
control: pid
pid_Kp: 21.527
pid_Ki: 1.063
pid_Kd: 108.982
# reference (this printer, 210 C): pid_kp 25.677, pid_ki 1.427, pid_kd 115.547
min_temp: 0
max_temp: 250
# reference: PA tower (bowden, FACTOR=.020) was smoothest at 15-20 mm (0.30-0.40)
# and the stock single-gear extruder grinds near 0.40, so 0.32 was kept.
# Run your own tower; 0 until then.
pressure_advance: 0

[heater_bed]
heater_pin: PA2
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PC4
control: pid
pid_Kp: 54.027
pid_Ki: 0.770
pid_Kd: 948.182
# reference (this printer, 60 C): pid_kp 70.186, pid_ki 1.471, pid_kd 836.963
min_temp: 0
# upstream example uses 130; 110 is a safety margin for PLA/PETG
max_temp: 110

[fan]
pin: PA0

[bltouch]
# Not in the upstream example file: added for the 4.2.2 BLTouch port
# (^PB1 / PB0) and the stock CR Touch mount (-40 / -5).
sensor_pin: ^PB1
control_pin: PB0
x_offset: -40
y_offset: -5
# z_offset comes from PROBE_CALIBRATE (paper test) + SAVE_CONFIG.
# Marlin's M851 Z-1.25 is a sanity check only (Klipper sign is inverted: 1.25).
# reference: z_offset 1.099 on this printer.
# Deliberately low (nozzle stays high) until PROBE_CALIBRATE.
z_offset: 0.5
speed: 5
samples: 2
sample_retract_dist: 5
samples_tolerance: 0.05
samples_tolerance_retries: 3
stow_on_each_sample: True
probe_with_touch_mode: False

[safe_z_home]
# nozzle position that puts the probe at the bed centre (117.5, 117.5)
home_xy_position: 157.5, 122.5
speed: 100
z_hop: 10
z_hop_speed: 10

[bed_mesh]
# reference: 7x7 mesh range 0.205 mm after gantry fix + SCREWS_TILT_CALCULATE
speed: 120
horizontal_move_z: 5
# probe coordinates reachable with the (-40, -5) offset
mesh_min: 10, 10
mesh_max: 190, 220
probe_count: 7, 7
algorithm: bicubic
fade_start: 1
fade_end: 10

[screws_tilt_adjust]
# Nozzle positions that put the probe over each bed knob (knobs at ~33/202, 33/203).
# The right knobs are out of reach (nozzle X max 235 -> probe X 195): the
# nearest reachable point is used, so read those two with some tolerance.
screw1: 73, 38
screw1_name: front left
screw2: 235, 38
screw2_name: front right
screw3: 235, 208
screw3_name: rear right
screw4: 73, 208
screw4_name: rear left
horizontal_move_z: 10
speed: 100
screw_thread: CW-M4

[axis_twist_compensation]
# probe coordinates (the nozzle sits 40 mm further right): probe X 10..190
calibrate_start_x: 10
calibrate_end_x: 190
calibrate_y: 117.5
# reference: z_compensations = 0.008750, 0.006250, -0.015000 (SAVE_CONFIG writes it)

[firmware_retraction]
retract_length: 1.5
retract_speed: 30
unretract_extra_length: 0
unretract_speed: 30

[exclude_object]

# Uncomment after installing moonraker-obico (it creates this file):
#[include moonraker_obico_macros.cfg]
